name: ShelfCase
options:
  bundleIdPrefix: com.shelfcase
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM in your environment or xcconfig for device builds.
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"

packages:
  ShelfCaseKit:
    path: ../../ShelfCaseKit

targets:
  ShelfCase:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShelfCase
        excludes:
          - "**/*.md"
    dependencies:
      - package: ShelfCaseKit
        product: ShelfCaseKit
    info:
      path: ShelfCase/Info.plist
      properties:
        CFBundleDisplayName: ShelfCase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleName: ShelfCase
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: ShelfCase uses the camera to photograph items you are cataloguing.
        NSPhotoLibraryUsageDescription: ShelfCase imports photos of your collectibles from your library.
        NSUserTrackingUsageDescription: Not used by ShelfCase.
        UIBackgroundModes:
          - fetch
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelfcase.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  ShelfCaseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShelfCaseTests
    dependencies:
      - target: ShelfCase
      - package: ShelfCaseKit
        product: ShelfCaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelfcase.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ShelfCase:
    build:
      targets:
        ShelfCase: all
        ShelfCaseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ShelfCaseTests
    archive:
      config: Release
